name: Auto Update Live IPO & GMP JSON

on:
  schedule:
    # Runs every 30 minutes between 4:00 AM and 3:00 PM UTC (9:30 AM to 8:30 PM IST)
    - cron: '*/30 4-15 * * *'
  workflow_dispatch: # Lets you trigger it manually with 1 click

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run IPO & GMP Scraper
        run: python scraper.py

      - name: Commit and Push updated ipos.json
        run: |
          git config --global user.name "IPO Data Bot"
          git config --global user.email "actions@github.com"
          git add ipos.json
          git diff --staged --quiet || (git commit -m "Auto-update live IPO & GMP data" && git push)
