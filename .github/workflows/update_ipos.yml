name: Auto Update Live IPO & GMP JSON

on:
  schedule:
    - cron: '*/30 4-15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run IPO & GMP Script
        run: python3 scraper.py

      - name: Commit and Push updated ipos.json
        run: |
          git config user.name "IPO Data Bot"
          git config user.email "actions@github.com"
          git add ipos.json
          git commit -m "Auto-update live IPO & GMP data" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
